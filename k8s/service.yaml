# k8s/service.yaml
#
# Defines HOW traffic reaches the pods.
#
# Without a Service, pods are only reachable by their internal
# IP which changes every time a pod restarts. The Service gives
# a stable endpoint that always routes to healthy pods.
#
# Think of it like a load balancer in front of your pods.

apiVersion: v1
kind: Service
metadata:
  name: cme-churn-api-service
  namespace: default
  labels:
    app: cme-churn-api
spec:
  selector:
    # Route traffic to all pods with this label
    app: cme-churn-api

  ports:
    - name: http
      protocol: TCP
      port: 80          # external port (what callers use)
      targetPort: 8000  # internal port (what pods listen on)

  # LoadBalancer type creates an Azure Load Balancer
  # with a public IP — external systems can reach the API
  # In production: use ClusterIP + Ingress controller instead
  # for more control over routing and SSL termination
  type: LoadBalancer